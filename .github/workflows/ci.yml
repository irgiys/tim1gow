# =============================================================================
#  CI iMitra — workflow eksplisit sesuai ADR-0001
# =============================================================================
#
#  Stack (AGENTS.md bagian 2): Go 1.22 + Chi + GORM + golang-migrate,
#  Next.js 14.2 + React 18 + TS 5.4, PostgreSQL 16.
#
#  Perintah lint/test di berkas ini WAJIB identik dengan AGENTS.md bagian 7 dan
#  README.md bagian 2.6. Kalau ketiganya berbeda, salah satunya sudah usang.
#
#  Berkas ini menggantikan workflow deteksi-stack bawaan template: sekarang
#  stack sudah diputuskan, jadi job-nya eksplisit — lebih cepat dan tidak rapuh.
#
#  PERILAKU TERHADAP DIREKTORI YANG BELUM ADA:
#    backend/ dan frontend/ dibuat bertahap selama Sprint 0-1. Job yang
#    direktorinya belum ada akan SKIP, tetapi job `ci` di akhir menuliskan
#    peringatan eksplisit selama masih ada yang skip. Skip itu hanya sah sebelum
#    walking skeleton; pada tag v1.0.0 kedua job WAJIB benar-benar berjalan.
#
#  CI MERAH DI TAG v1.0.0 DIKENAI PENGURANGAN NILAI -5. CI yang dinonaktifkan,
#  atau yang hijau karena tidak menjalankan test apa pun, dinilai sama dengan
#  tidak ada CI. Jangan melemahkan test supaya hijau (AGENTS.md Larangan 7).
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# Batalkan run lama pada ref yang sama supaya runner tidak menumpuk.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Versi terpusat — samakan dengan AGENTS.md bagian 2 dan ADR-0001.
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  POSTGRES_IMAGE: "postgres:16-alpine"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Apakah direktori kode sudah ada? Menentukan job mana yang berjalan.
  # ---------------------------------------------------------------------------
  detect:
    name: Deteksi direktori kode
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
      mock_slik: ${{ steps.d.outputs.mock_slik }}
    steps:
      - uses: actions/checkout@v4

      - id: d
        shell: bash
        run: |
          set -euo pipefail

          # Penanda keberadaan adalah MANIFEST-nya, bukan direktoriya: direktori
          # kosong hasil `mkdir` tidak boleh membuat job gagal karena tidak ada
          # yang bisa di-build.
          [ -f backend/go.mod ]        && BE=true || BE=false
          [ -f frontend/package.json ] && FE=true || FE=false
          [ -f mock-slik/go.mod ]      && MS=true || MS=false

          {
            echo "backend=$BE"
            echo "frontend=$FE"
            echo "mock_slik=$MS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Direktori kode yang terdeteksi"
            echo ""
            echo "| Komponen | Manifest | Ada |"
            echo "|---|---|---|"
            echo "| backend | backend/go.mod | $BE |"
            echo "| frontend | frontend/package.json | $FE |"
            echo "| mock-slik | mock-slik/go.mod | $MS |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Pemeriksaan higienis repo. Berjalan selalu.
  #    Murah, dan kegagalannya menyelamatkan nilai (secret ter-commit = -10).
  # ---------------------------------------------------------------------------
  higiene:
    name: Higiene repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pastikan tidak ada berkas .env ter-commit
        shell: bash
        run: |
          set -euo pipefail
          # .env.example WAJIB ada; .env dan turunannya TIDAK BOLEH ter-commit.
          BAD=$(git ls-files | grep -E '(^|/)\.env($|\.[^e]|\.local$|\.production$)' || true)
          if [ -n "$BAD" ]; then
            echo "::error title=Berkas .env ter-commit::$BAD"
            echo "Brief §7.2 butir 7: tidak ada secret di dalam repo. Secret ter-commit dikenai -10,"
            echo "termasuk kalau sudah dihapus di commit berikutnya. Hapus dari riwayat, bukan hanya dari HEAD."
            exit 1
          fi
          echo "OK: tidak ada berkas .env ter-commit."

      - name: Pastikan .env.example ada
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .env.example ]; then
            echo "::error title=.env.example hilang::Berkas .env.example wajib ada (brief §8.1)."
            exit 1
          fi
          echo "OK: .env.example ada."

      - name: Pastikan artefak wajib repo ada
        shell: bash
        run: |
          set -euo pipefail
          MISSING=""
          for f in README.md AGENTS.md docs/AI-DEVLOG.md docs/AI-WORKFLOW.md \
                   docs/TRACEABILITY.md docs/DEMO-SCRIPT.md docs/SRS-iMitra.md \
                   docs/SDD-iMitra.md docs/adr/0001-pilihan-stack.md \
                   fixtures/nasabah-uji.csv docker-compose.yml; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            # Peringatan, bukan kegagalan: sebagian berkas mungkin belum dibuat di jam pertama.
            echo "::warning title=Artefak wajib belum ada::$MISSING"
          else
            echo "OK: seluruh artefak wajib ada."
          fi

      - name: Ingatkan placeholder yang belum diisi
        shell: bash
        run: |
          set -euo pipefail
          # Hitung placeholder "<!-- ISI:" yang masih tersisa. Tidak menggagalkan CI,
          # tetapi angkanya harus menuju nol menjelang code freeze.
          COUNT=$(grep -rIl '<!-- ISI:' --include='*.md' . 2>/dev/null | wc -l | tr -d ' ')
          TOTAL=$(grep -rIo '<!-- ISI:' --include='*.md' . 2>/dev/null | wc -l | tr -d ' ')
          echo "Berkas dengan placeholder belum diisi: $COUNT (total placeholder: $TOTAL)"
          if [ "${TOTAL:-0}" -gt 0 ]; then
            echo "::warning title=Placeholder template belum diisi::$TOTAL placeholder '<!-- ISI: -->' tersisa di $COUNT berkas. Harus nol sebelum tag v1.0.0."
          fi

      - name: Pastikan variabel compose ada di .env.example
        shell: bash
        run: |
          set -euo pipefail
          # Penyebab paling umum "jalan di laptop saya": variabel dipakai
          # docker-compose.yml tetapi tidak pernah ditulis di .env.example,
          # sehingga .env penilai tidak memuatnya.
          # Hanya baris AKTIF (bukan komentar) yang diperiksa.
          MISSING=""
          USED=$(grep -v '^[[:space:]]*#' docker-compose.yml \
                 | grep -oE '\$\{[A-Z0-9_]+\}' \
                 | tr -d '${}' | sort -u)
          for v in $USED; do
            grep -qE "^${v}=" .env.example || MISSING="$MISSING $v"
          done
          if [ -n "$MISSING" ]; then
            echo "::error title=Variabel tidak ada di .env.example::$MISSING"
            echo "Variabel di atas dipakai docker-compose.yml tetapi tidak dideklarasikan"
            echo "di .env.example, sehingga 'cp .env.example .env && docker compose up' gagal"
            echo "di mesin penilai."
            exit 1
          fi
          echo "OK: seluruh variabel compose ada di .env.example."

      - name: Pastikan tidak ada AutoMigrate (skema hanya dari migrasi SQL)
        shell: bash
        run: |
          set -euo pipefail
          # AGENTS.md Larangan 16: skema HANYA dari berkas migrasi golang-migrate.
          # gorm.AutoMigrate membuat skema mesin penilai menyimpang dari migrasi.
          HIT=$(grep -rn 'AutoMigrate' --include='*.go' . 2>/dev/null || true)
          if [ -n "$HIT" ]; then
            echo "::error title=AutoMigrate dipakai::$HIT"
            echo "AGENTS.md Larangan 16: skema database hanya berasal dari backend/migrations/."
            exit 1
          fi
          echo "OK: tidak ada pemakaian AutoMigrate."

  # ---------------------------------------------------------------------------
  # 3. Backend Go — gofmt, vet, golangci-lint, test unit + integrasi.
  #    Service postgres disediakan supaya test integrasi bisa berjalan.
  # ---------------------------------------------------------------------------
  backend:
    name: Lint & test — backend (Go)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imitra_test
          POSTGRES_USER: imitra_app
          # Nilai ini hanya hidup di runner CI yang sekali pakai; bukan secret.
          POSTGRES_PASSWORD: imitra_ci_password
        ports:
          - 5432:5432
        # Job tidak boleh mulai sebelum Postgres benar-benar SIAP menerima koneksi.
        options: >-
          --health-cmd "pg_isready -U imitra_app -d imitra_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://imitra_app:imitra_ci_password@localhost:5432/imitra_test?sslmode=disable
      DATABASE_URL_TEST: postgres://imitra_app:imitra_ci_password@localhost:5432/imitra_test?sslmode=disable
      # Test integrasi memerlukan nilai ini; keduanya nilai uji, bukan secret.
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_EXPIRES_IN: 8h
      PASSWORD_HASH_COST: "4" # rendah supaya seed & test cepat di CI
      SEED_DEFAULT_PASSWORD: Demo1234!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.sum belum ada selama backend masih memakai stdlib saja. Cache
          # by-manifest tetap valid dengan go.mod, dan `cache-dependency-path`
          # yang menunjuk berkas tidak ada membuat langkah ini gagal.
          cache-dependency-path: backend/go.mod

      - name: Unduh dependensi
        run: go mod download

      - name: gofmt (harus tidak menghasilkan output)
        run: |
          set -euo pipefail
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error title=gofmt::Berkas berikut belum diformat:"
            echo "$OUT"
            echo "Jalankan: gofmt -w ."
            exit 1
          fi
          echo "OK: format bersih."

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: backend
          # Dependensi sudah di-cache oleh setup-go di atas.
          skip-cache: true

      - name: Apakah runner migrate & seed sudah ada
        id: runner
        run: |
          set -euo pipefail
          # backend/cmd/migrate dan backend/cmd/seed dibuat bertahap. Selama
          # keduanya belum ada, `go run ./cmd/migrate` gagal dengan "no Go files"
          # dan membuat CI merah karena berkas yang memang belum ditulis —
          # bukan karena ada yang rusak.
          [ -d cmd/migrate ] && M=true || M=false
          [ -d cmd/seed ]    && S=true || S=false
          echo "migrate=$M" >> "$GITHUB_OUTPUT"
          echo "seed=$S"    >> "$GITHUB_OUTPUT"
          if [ "$M" = "false" ] || [ "$S" = "false" ]; then
            echo "::warning title=Runner migrasi/seed belum ada::cmd/migrate=$M cmd/seed=$S. Langkah migrasi dan seed dilewati, sehingga test integrasi yang memerlukan database BELUM diuji. Wajib ada sebelum walking skeleton."
          fi

      - name: Migrasi (database test)
        if: steps.runner.outputs.migrate == 'true'
        run: go run ./cmd/migrate up

      - name: Seed data uji (idempoten)
        if: steps.runner.outputs.seed == 'true'
        run: go run ./cmd/seed

      - name: Seed dijalankan ulang — wajib tetap lolos (idempoten)
        # Brief §7.2 butir 5: seed wajib idempoten. Menjalankannya dua kali di CI
        # adalah cara termurah membuktikannya, bukan sekadar mengklaimnya.
        if: steps.runner.outputs.seed == 'true'
        run: go run ./cmd/seed

      - name: Test (unit + integrasi)
        run: go test ./... -count=1

  # ---------------------------------------------------------------------------
  # 4. mock-slik — modul Go terpisah (AGENTS.md bagian 2).
  #    Tanpa database: ia hanya membaca fixtures/nasabah-uji.csv.
  # ---------------------------------------------------------------------------
  mock-slik:
    name: Lint & test — mock SLIK (Go)
    needs: detect
    if: needs.detect.outputs.mock_slik == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-slik
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mock-slik/go.sum

      - name: gofmt (harus tidak menghasilkan output)
        run: |
          set -euo pipefail
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error title=gofmt::Berkas berikut belum diformat:"
            echo "$OUT"
            exit 1
          fi
          echo "OK: format bersih."

      - name: go vet & build & test
        run: |
          set -euo pipefail
          go vet ./...
          go build ./...
          go test ./... -count=1

  # ---------------------------------------------------------------------------
  # 5. Frontend Next.js — lint + build.
  #    Test frontend belum wajib di P0 (AGENTS.md bagian 2), tetapi `npm run
  #    build` menangkap kesalahan tipe TypeScript, dan itu yang paling sering
  #    merusak demo.
  # ---------------------------------------------------------------------------
  frontend:
    name: Lint & build — frontend (Next.js)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Next menanamkan NEXT_PUBLIC_* saat BUILD. Nilai ini hanya supaya build
      # CI tidak gagal; URL sebenarnya ditentukan build arg di docker-compose.yml.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning title=Lockfile tidak ada::npm ci butuh package-lock.json. Commit lockfile supaya build reproducible."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 6. Gerbang akhir. Ini job yang didaftarkan sebagai required status check di
  #    branch protection (Settings > Branches > main), supaya satu nama saja yang
  #    perlu didaftarkan walaupun job stack berubah.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    needs: [detect, higiene, backend, mock-slik, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kumpulkan hasil
        shell: bash
        run: |
          set -euo pipefail
          echo "detect    : ${{ needs.detect.result }}"
          echo "higiene   : ${{ needs.higiene.result }}"
          echo "backend   : ${{ needs.backend.result }}"
          echo "mock-slik : ${{ needs['mock-slik'].result }}"
          echo "frontend  : ${{ needs.frontend.result }}"

          # 'skipped' diterima (komponen itu belum ada). 'failure' dan 'cancelled' tidak.
          for r in "${{ needs.detect.result }}" "${{ needs.higiene.result }}" \
                   "${{ needs.backend.result }}" "${{ needs['mock-slik'].result }}" \
                   "${{ needs.frontend.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error title=CI gagal::Ada job yang tidak lolos (status: $r)."; exit 1 ;;
            esac
          done

          # Peringatan selama masih ada komponen yang belum diuji sama sekali.
          # Ini sah sebelum walking skeleton; pada tag v1.0.0 tidak lagi.
          if [ "${{ needs.detect.outputs.backend }}" != "true" ]; then
            echo "::warning title=Backend belum diuji::backend/go.mod belum ada, job backend dilewati."
          fi
          if [ "${{ needs.detect.outputs.frontend }}" != "true" ]; then
            echo "::warning title=Frontend belum diuji::frontend/package.json belum ada, job frontend dilewati."
          fi
          if [ "${{ needs.detect.outputs.mock_slik }}" != "true" ]; then
            echo "::warning title=Mock SLIK belum diuji::mock-slik/go.mod belum ada, job mock-slik dilewati."
          fi

          echo "CI lolos."
