# =============================================================================
#  docker-compose.yml — iMitra
# =============================================================================
#
#  TARGET YANG DINILAI:
#      git clone <repo> && cd <repo> && cp .env.example .env && docker compose up
#  dari CLONE BERSIH di mesin penilai, dan seluruh sistem hidup.
#  Brief §7.2 butir 1: "Kalau hanya jalan di laptop Anda, ia tidak jalan."
#  Gate 2 (Kamis 15.30) menguji ini secara langsung.
#
#  Stack mengikuti ADR-0001 / AGENTS.md bagian 2:
#      PostgreSQL 16-alpine · backend Go 1.22 (Chi) · mock SLIK Go · Next.js 14.2
#
#  STATUS PENGISIAN (perbarui baris ini setiap kali satu service diaktifkan):
#    [x] db          — aktif
#    [ ] mock-slik   — blok siap pakai, menunggu mock-slik/Dockerfile (Yulio Zaki)
#    [ ] migrate     — menunggu backend/Dockerfile + cmd/migrate & cmd/seed
#    [ ] backend     — menunggu backend/Dockerfile
#    [ ] frontend    — menunggu frontend/Dockerfile (Aldi)
#
#  Sebuah service hanya boleh di-uncomment kalau Dockerfile-nya SUDAH ada di repo.
#  Meng-uncomment `build.context` yang direktorinya belum ada membuat
#  `docker compose up` gagal total di mesin penilai — lebih buruk daripada
#  service yang belum aktif.
#
#  Empat kesalahan yang paling sering membuat penilai gagal menjalankan repo:
#    a. Backend start sebelum database siap. `depends_on` biasa hanya menunggu
#       container DIBUAT, bukan SIAP. Pakai `condition: service_healthy`.
#    b. Frontend memanggil backend dengan nama service docker (http://backend:8080).
#       Salah: pemanggilnya adalah BROWSER di host, bukan container. Pakai
#       http://localhost:<BACKEND_PORT>. Backend memanggil mock-slik dengan nama
#       service (http://mock-slik:9090) — itu yang benar, karena pemanggilnya container.
#    c. Migrasi dan seed hanya pernah dijalankan manual di laptop pembuatnya,
#       sehingga database penilai kosong.
#    d. Nilai env hanya ada di .env lokal seseorang dan tidak ada di .env.example.
#
#  Nama variabel di bawah mengacu ke .env.example. Kalau Anda mengubahnya di satu
#  tempat, ubah di kedua tempat.
# =============================================================================

# Compose modern tidak memerlukan kunci `version`. Jangan tambahkan kembali.

services:

  # ---------------------------------------------------------------------------
  #  db — PostgreSQL 16 (AGENTS.md bagian 2)
  #
  #  Dua database dibuat saat inisialisasi:
  #    - ${DB_NAME}       : data demo, dipakai backend
  #    - ${DB_NAME}_test  : dipakai `go test ./test/...` (DATABASE_URL_TEST),
  #                         supaya test tidak menghapus data demo.
  #  Skema TIDAK dibuat di sini — hanya database kosongnya. Skema hanya berasal
  #  dari berkas migrasi golang-migrate di backend/migrations/ (AGENTS.md Larangan 16).
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: imitra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    ports:
      # Ekspos ke host hanya untuk inspeksi manual (psql / DBeaver) saat debugging.
      - "${DB_PORT}:5432"
    volumes:
      # Volume bernama, supaya data bertahan antar `docker compose up`.
      # Untuk mereset demo: docker compose down -v
      - imitra-db-data:/var/lib/postgresql/data
      # Skrip di /docker-entrypoint-initdb.d/ HANYA dijalankan saat volume masih
      # kosong. Karena itu ia idempoten secara alami, dan karena itu pula
      # `down -v` diperlukan kalau skrip ini berubah.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Pola healthcheck yang ditiru service lain.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s      # sesering apa diperiksa
      timeout: 3s       # batas satu kali pemeriksaan
      retries: 10       # berapa kali gagal sebelum dinyatakan unhealthy
      start_period: 10s # masa tenggang saat container baru start
    networks:
      - imitra

  # ---------------------------------------------------------------------------
  #  mock-slik — stub layanan SLIK (brief §6.1, AGENTS.md bagian 5.2)
  #
  #  BLOK INI SIAP PAKAI. Uncomment begitu mock-slik/Dockerfile ada.
  #  Kontrak endpoint tidak boleh diubah:
  #    POST /slik/inquiry → 200 | 404 NIK_NOT_FOUND | 503 SERVICE_UNAVAILABLE
  #  Data dibaca dari fixtures/nasabah-uji.csv saat start (di-mount read-only),
  #  bukan disalin ke dalam kode. NIK 3404999999999999 memicu 404 dan
  #  3404000000000503 memicu 503 — keduanya sudah ada di fixtures.
  #  Wajib menyediakan GET /health supaya healthcheck di bawah berfungsi, dan
  #  image harus memuat wget (alpine sudah punya; distroless/scratch TIDAK —
  #  ini penyebab umum container selalu unhealthy padahal layanannya hidup).
  # ---------------------------------------------------------------------------
  # mock-slik:
  #   build:
  #     context: ./mock-slik
  #   container_name: imitra-mock-slik
  #   restart: unless-stopped
  #   environment:
  #     PORT: 9090
  #     TZ: ${TZ}
  #     # Path fixtures DI DALAM container, bukan path di host.
  #     FIXTURES_PATH: /app/fixtures/nasabah-uji.csv
  #     LOG_LEVEL: ${LOG_LEVEL}
  #   ports:
  #     - "${MOCK_SLIK_PORT}:9090"
  #   volumes:
  #     # read-only: mock tidak boleh menulis ke fixtures.
  #     - ./fixtures:/app/fixtures:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #     start_period: 5s
  #   networks:
  #     - imitra

  # ---------------------------------------------------------------------------
  #  migrate — service sekali jalan: migrasi lalu seed, keduanya idempoten.
  #
  #  Dipisahkan dari `backend` supaya penilai tidak perlu menjalankan perintah
  #  tambahan, dan supaya kegagalan migrasi terlihat jelas sebagai kegagalan
  #  service tersendiri, bukan tersembunyi di log startup backend.
  #  `backend` menunggunya dengan condition: service_completed_successfully.
  #
  #  Uncomment bersamaan dengan backend/Dockerfile, backend/cmd/migrate, dan
  #  backend/cmd/seed. Perintahnya mengikuti AGENTS.md bagian 7.
  # ---------------------------------------------------------------------------
  #  CATATAN: `/app/seed` belum diaktifkan karena backend/cmd/seed belum ada.
  #  Untuk sementara seed nilai awal tabel parameter ditangani migrasi
  #  000002_seed_parameter.up.sql (ON CONFLICT DO NOTHING, jadi idempoten).
  #  Tambahkan `&& /app/seed` di command begitu cmd/seed dibuat.
  migrate:
    build:
      context: ./backend
    container_name: imitra-migrate
    environment:
      APP_ENV: ${APP_ENV}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      PASSWORD_HASH_COST: ${PASSWORD_HASH_COST}
    command: ["/app/migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - imitra

  # ---------------------------------------------------------------------------
  #  backend — API Go (Chi), port 8080 di dalam container.
  #
  #  Uncomment begitu backend/Dockerfile ada. Catatan:
  #    - SLIK_BASE_URL memakai nama service docker (http://mock-slik:9090):
  #      benar, karena pemanggilnya container backend.
  #    - /health wajib memeriksa koneksi database, bukan hanya membalas 200.
  #    - Tidak ada nilai secret yang ditulis di sini; semuanya dari .env.
  # ---------------------------------------------------------------------------
  #  CATATAN: dependensi ke `mock-slik` belum diaktifkan karena direktori
  #  mock-slik/ belum ada (pemilik: Yulio Zaki). Tambahkan kembali blok
  #  `mock-slik: condition: service_healthy` di depends_on begitu service itu
  #  aktif, supaya backend tidak start sebelum SLIK siap.
  backend:
    build:
      context: ./backend
    container_name: imitra-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_TEST: ${DATABASE_URL_TEST}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PASSWORD_HASH_COST: ${PASSWORD_HASH_COST}
      SLIK_BASE_URL: ${SLIK_BASE_URL}
      SLIK_INQUIRY_PATH: ${SLIK_INQUIRY_PATH}
      SLIK_TIMEOUT_MS: ${SLIK_TIMEOUT_MS}
      SLIK_RETRY: ${SLIK_RETRY}
      SLIK_RESULT_VALID_DAYS: ${SLIK_RESULT_VALID_DAYS}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      UPLOAD_ALLOWED_MIME: ${UPLOAD_ALLOWED_MIME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - imitra-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /readyz memeriksa koneksi database (503 bila DB tidak siap); /healthz
      # hanya liveness. Yang dipakai di sini readiness, sesuai catatan di atas.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - imitra

  # ---------------------------------------------------------------------------
  #  frontend — Next.js 14 (App Router), disajikan sebagai hasil build.
  #
  #  Uncomment begitu frontend/Dockerfile ada. Catatan penting:
  #    - Next menanamkan variabel NEXT_PUBLIC_* saat BUILD, bukan runtime, jadi
  #      URL API dilewatkan sebagai build arg. Periksa ini lebih awal, bukan
  #      pada Jumat sore.
  #    - Nilainya http://localhost:${BACKEND_PORT} karena yang memanggil adalah
  #      BROWSER di host, bukan container.
  # ---------------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     args:
  #       NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT}
  #   container_name: imitra-frontend
  #   restart: unless-stopped
  #   environment:
  #     TZ: ${TZ}
  #     NODE_ENV: production
  #   ports:
  #     - "${FRONTEND_PORT}:3000"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - imitra

# =============================================================================
#  Volume & network
# =============================================================================
volumes:
  imitra-db-data:
  # Uncomment bersamaan dengan service backend yang memakainya.
  imitra-uploads:

networks:
  imitra:
    driver: bridge

# =============================================================================
#  Checklist sebelum menyatakan berkas ini selesai
#  (ulangi sebelum Gate 2 dan sekali lagi sebelum code freeze)
#
#   [ ] `docker compose config` tidak mengeluarkan error
#   [ ] `docker compose up` berhasil dari direktori hasil clone BARU
#   [ ] Semua service berstatus healthy (`docker compose ps`)
#   [ ] Migrasi dan seed jalan otomatis; database penilai tidak kosong
#   [ ] `docker compose up` kedua kali tidak error karena seed dijalankan ulang
#   [ ] Frontend bisa login sebagai AO tanpa mengubah konfigurasi apa pun
#   [ ] Backend berhasil memanggil mock-slik (uji dengan NIK dari fixtures)
#   [ ] Cara mereset demo terdokumentasi di README.md bagian 2.4
#   [ ] Semua variabel yang dipakai berkas ini ada di .env.example
#   [ ] Tidak ada nilai secret yang ditulis langsung di berkas ini
# =============================================================================
